[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "artcraft-bridge"
dynamic = ["version"]
description = "Independent local desktop automation bridge for ArtCraft Crafting Apps"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{name = "ArtCraft Bridge contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
artcraft-bridge = "artcraft_bridge.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "artcraft_bridge.__version__"}

[project.urls]
Repository = "https://github.com/bpnace/artcraft-bridge"
Issues = "https://github.com/bpnace/artcraft-bridge/issues"
